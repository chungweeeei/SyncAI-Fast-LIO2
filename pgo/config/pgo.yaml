# Base (un-namespaced) values. pgo_launch.py rewrites cloud_topic / odom_topic /
# local_frame with the <robot_id>/ prefix read from config/system.ini into a
# generated copy under /tmp/syncai_pgo/, because pgo_node hand-parses this file
# with yaml-cpp instead of taking ROS parameters. The plain values below only
# apply when running pgo_node bare with this file as its config_path.
cloud_topic: /pointlio/body_cloud
odom_topic: /pointlio/lio_odom
map_frame: map
# LIO world frame that pgo's map->local_frame TF should correct
# (matches pointlio's world_frame; original upstream value was "lidar").
local_frame: lio_odom

key_pose_delta_deg: 10
key_pose_delta_trans: 0.5
loop_search_radius: 1.0
loop_time_tresh: 60.0
loop_score_tresh: 0.15
loop_submap_half_range: 5
submap_resolution: 0.1
min_loop_detect_duration: 5.0

# "Map so far" cloud published on pgo/map_cloud for the operator console while
# mapping. Merged from every keyframe's *current* (loop-closure-corrected)
# global pose on a background thread, so it never stalls the 50 ms timer that
# owns the map->local_frame TF broadcast. Publishing is subscriber-gated and
# keyframe-triggered; the period below is a floor on top of that.
map_cloud_resolution: 0.2   # voxel leaf (m) of the published merge
map_cloud_pub_period: 3.0   # min seconds between publishes