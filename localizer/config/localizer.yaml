cloud_topic: /pointlio/body_cloud
odom_topic: /pointlio/lio_odom
map_frame: map
local_frame: laser
# initial guess 來源（RViz 2D Pose Estimate 等）。相對名會繼承 node namespace，
# 實際 topic 為 /<robot_id>/localizer/initialpose
initialpose_topic: initialpose
# map_path（選填）：initialpose 在地圖尚未載入時自動 loadMap 用的 PCD。
# 這裡不設值——launch 會從 system.ini 的 [map] pcd 注入絕對路徑；
# 沒設定時 initialpose 需要先跑過一次 relocalize 才有效
update_hz: 1.0

rough_scan_resolution: 0.25
rough_map_resolution: 0.25
rough_max_iteration: 5
rough_score_thresh: 0.2
# correspondence 配對距離上限（m）：rough 給大一點吸收 relocalize 手動 guess 的誤差
rough_max_corr_dist: 2.0

refine_scan_resolution: 0.1
refine_map_resolution: 0.1
refine_max_iteration: 10
refine_score_thresh: 0.1
# refine 收緊，只用近距離配對做精配
refine_max_corr_dist: 0.5